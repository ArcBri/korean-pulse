# Hourly Web Push trigger for Hangul Hour.
#
# PRIMARY SCHEDULER: use an external free cron (cron-job.org) hitting
#   https://www.hangul-hour.app/api/push/cron
# GitHub Actions `schedule` has not been firing for this repo (only
# workflow_dispatch works). Keep this workflow for manual "Run workflow"
# backups and in case GitHub schedules start working later.
#
# Cron expressions here are UTC. Local study hours are applied in the API.
#
# Required repo secrets (for this workflow only):
#   HANGUL_HOUR_CRON_URL  — https://www.hangul-hour.app/api/push/cron
#   CRON_SECRET           — same value as the Vercel CRON_SECRET env var

name: Hourly Web Push

on:
  schedule:
    # Kept as a best-effort backup. Prefer cron-job.org — see docs/web-push-setup.
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger push cron
        env:
          HANGUL_HOUR_CRON_URL: ${{ secrets.HANGUL_HOUR_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          echo "UTC now: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Event: ${GITHUB_EVENT_NAME}"

          if [ -z "${HANGUL_HOUR_CRON_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "Missing HANGUL_HOUR_CRON_URL or CRON_SECRET secrets; skipping."
            exit 0
          fi

          echo "Calling cron endpoint..."
          response="$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: hangul-hour-github-action" \
            "${HANGUL_HOUR_CRON_URL}")"

          echo "Cron response: ${response}"

          if echo "${response}" | grep -q '"checked":0'; then
            echo "::warning::No push subscriptions in Redis (checked=0). Enable notifications from the iPhone Home Screen app after push is configured."
          fi
